    <text x="260" y="395" fill="#a09c9a" font-family="'Manrope', sans-serif" font-size="12">DESCRIPTION</text>
    <text x="500" y="395" fill="#a09c9a" font-family="'Manrope', sans-serif" font-size="12">CONSIGNMENT OUT</text>
    <text x="680" y="395" fill="#a09c9a" font-family="'Manrope', sans-serif" font-size="12">ACTUAL SOLD</text>
    <text x="800" y="395" fill="#a09c9a" font-family="'Manrope', sans-serif" font-size="12">RETURN</text>
    <line x1="75" y1="410" x2="880" y2="410" stroke="#332427"/>
    <text x="75" y="445" fill="#f2efeb" font-family="'Manrope', sans-serif" font-size="12">SKU-AOM-01</text>
    <text x="260" y="445" fill="#f2efeb" font-family="'Manrope', sans-serif" font-size="12">Organik Fertilizer Standard 1L</text>
    <text x="500" y="445" fill="#f2efeb" font-family="'Manrope', sans-serif" font-size="12">500 units</text>
    <text x="680" y="445" fill="#20bf6b" font-family="'Manrope', sans-serif" font-size="12">462 units</text>
    <text x="800" y="445" fill="#ef4151" font-family="'Manrope', sans-serif" font-size="12">38 units</text>

    <text x="75" y="485" fill="#f2efeb" font-family="'Manrope', sans-serif" font-size="12">SKU-AOM-02</text>
    <text x="260" y="485" fill="#f2efeb" font-family="'Manrope', sans-serif" font-size="12">Premium Plant Booster 500ml</text>
    <text x="500" y="485" fill="#f2efeb" font-family="'Manrope', sans-serif" font-size="12">300 units</text>
    <text x="680" y="485" fill="#20bf6b" font-family="'Manrope', sans-serif" font-size="12">285 units</text>
    <text x="800" y="485" fill="#ef4151" font-family="'Manrope', sans-serif" font-size="12">15 units</text>
