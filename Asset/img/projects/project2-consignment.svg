    <rect x="360" y="100" width="250" height="180" rx="6" fill="#1b1718" stroke="#332427"/>
    <text x="380" y="135" fill="#f2efeb" font-family="'Manrope', sans-serif" font-weight="700" font-size="14">Serverless Backend</text>
    <text x="380" y="165" fill="#a09c9a" font-family="'Manrope', sans-serif" font-size="12">Vercel Edge API</text>
    <text x="380" y="195" fill="#ef4151" font-family="'Manrope', sans-serif" font-weight="600" font-size="11">Region latency resolved</text>
    <text x="380" y="225" fill="#20bf6b" font-family="'Manrope', sans-serif" font-size="12">Auth & JWT Validation</text>

    <!-- Arrow -->
    <line x1="610" y1="190" x2="670" y2="190" stroke="#ef4151" stroke-width="3"/>
    <polygon points="670,190 660,185 660,195" fill="#ef4151"/>

    <rect x="670" y="100" width="240" height="180" rx="6" fill="#1b1718" stroke="#332427"/>
    <text x="690" y="135" fill="#f2efeb" font-family="'Manrope', sans-serif" font-weight="700" font-size="14">Supabase PostgreSQL</text>
    <text x="690" y="165" fill="#a09c9a" font-family="'Manrope', sans-serif" font-size="12">SG Region Co-located</text>
    <text x="690" y="195" fill="#a09c9a" font-family="'Manrope', sans-serif" font-size="12">Consignment Ledger</text>
    <text x="690" y="225" fill="#a09c9a" font-family="'Manrope', sans-serif" font-size="12">Audit History & Retur</text>

    <!-- Table of stock items -->
    <rect x="50" y="310" width="860" height="230" rx="6" fill="#1b1718" stroke="#332427"/>
    <text x="75" y="345" fill="#f2efeb" font-family="'Manrope', sans-serif" font-weight="700" font-size="14">Outlet Consignment Reconcile Ledger</text>
