<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
    <rect width="960" height="600" fill="#0d0d0e"/>
    <rect x="20" y="20" width="920" height="560" rx="8" fill="#141416" stroke="#2a1f22"/>
    <!-- Top bar -->
    <rect x="20" y="20" width="920" height="50" rx="8" fill="#1b1718" stroke="#332427"/>
    <circle cx="50" cy="45" r="6" fill="#ef4151"/>
    <circle cx="70" cy="45" r="6" fill="#ffb830"/>
    <circle cx="90" cy="45" r="6" fill="#20bf6b"/>
    <text x="130" y="52" fill="#f2efeb" font-family="'Manrope', sans-serif" font-weight="700" font-size="14">STOCK OPNAME & CONSIGNMENT TRACKER [REACT / SUPABASE / VERCEL]</text>
    <rect x="790" y="32" width="130" height="26" rx="4" fill="#3ecf8e" fill-opacity="0.15"/>
    <text x="805" y="49" fill="#3ecf8e" font-family="'Manrope', sans-serif" font-weight="800" font-size="10">INTERNAL PROJECT</text>

    <!-- Architecture flow -->
    <rect x="50" y="100" width="250" height="180" rx="6" fill="#1b1718" stroke="#332427"/>
    <text x="70" y="135" fill="#f2efeb" font-family="'Manrope', sans-serif" font-weight="700" font-size="14">Outlet Client (React)</text>
    <text x="70" y="165" fill="#a09c9a" font-family="'Manrope', sans-serif" font-size="12">Mobile / Tablet browser</text>
    <text x="70" y="195" fill="#a09c9a" font-family="'Manrope', sans-serif" font-size="12">Realtime Stock Counting</text>
    <text x="70" y="225" fill="#a09c9a" font-family="'Manrope', sans-serif" font-size="12">Offline Batch Queuing</text>

    <!-- Arrow -->
