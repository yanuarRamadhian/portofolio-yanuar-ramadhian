<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <rect width="1200" height="680" fill="#110d0f"/>
  <rect x="25" y="25" width="1150" height="630" rx="8" fill="#171214" stroke="#4a1a22"/>
  <rect x="25" y="25" width="1150" height="65" rx="8" fill="#251216" stroke="#5d1e29"/>
  <circle cx="65" cy="58" r="7" fill="#ef4151"/>
  <circle cx="90" cy="58" r="7" fill="#ef4151" opacity="0.4"/>
  <circle cx="115" cy="58" r="7" fill="#ef4151" opacity="0.2"/>
  <text x="155" y="66" fill="#f2efeb" font-family="'Manrope', sans-serif" font-weight="800" font-size="18" letter-spacing="1">PROBLEM: CROSS-REGION LATENCY & SMB SHARING FAILURE</text>
  <rect x="990" y="40" width="160" height="35" rx="4" fill="#ef4151" fill-opacity="0.2" stroke="#ef4151"/>
  <text x="1012" y="63" fill="#ef4151" font-family="'Manrope', sans-serif" font-weight="800" font-size="12">BOTTLENECK DETECTED</text>

  <!-- Problem 1 diagram: Cross-Region Multi-Cloud Lag -->
  <rect x="60" y="120" width="510" height="490" rx="6" fill="#1b1416" stroke="#3d1b21"/>
  <text x="90" y="165" fill="#ef4151" font-family="'Anton', sans-serif" font-size="24">CASE 01: SERVERLESS API LATENCY</text>
  <text x="90" y="195" fill="#a09c9a" font-family="'Manrope', sans-serif" font-size="13">Symptom: Indonesian users experience 850ms+ request delay.</text>

  <rect x="90" y="230" width="180" height="90" rx="4" fill="#251619" stroke="#ef4151"/>
  <text x="110" y="265" fill="#f2efeb" font-family="'Manrope', sans-serif" font-weight="700" font-size="14">Edge Frontend</text>
  <text x="110" y="295" fill="#a09c9a" font-family="'Manrope', sans-serif" font-size="12">Jakarta Users (ID)</text>

  <path d="M 270 275 L 350 275" stroke="#ef4151" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="280" y="265" fill="#ef4151" font-family="'Manrope', sans-serif" font-weight="800" font-size="11">~280ms</text>

  <rect x="350" y="230" width="180" height="90" rx="4" fill="#251619" stroke="#ef4151"/>
  <text x="370" y="265" fill="#f2efeb" font-family="'Manrope', sans-serif" font-weight="700" font-size="14">Serverless Node</text>
  <text x="370" y="295" fill="#ef4151" font-family="'Manrope', sans-serif" font-size="12">US-East Region</text>

  <path d="M 440 320 L 440 400" stroke="#ef4151" stroke-width="4"/>
  <text x="450" y="365" fill="#ef4151" font-family="'Manrope', sans-serif" font-weight="800" font-size="12">570ms DB LAG</text>

  <rect x="350" y="400" width="180" height="90" rx="4" fill="#251619" stroke="#ef4151"/>
  <text x="370" y="435" fill="#f2efeb" font-family="'Manrope', sans-serif" font-weight="700" font-size="14">Supabase DB</text>
  <text x="370" y="465" fill="#ef4151" font-family="'Manrope', sans-serif" font-size="12">Frankfurt (EU)</text>

  <rect x="90" y="520" width="440" height="65" rx="4" fill="#31151b"/>
  <text x="110" y="555" fill="#ff7584" font-family="'Manrope', sans-serif" font-weight="600" font-size="12">Root Cause: Backend and database separated across 3 continents.</text>

  <!-- Problem 2 diagram: SMB vs Ping Misconception -->
  <rect x="630" y="120" width="510" height="490" rx="6" fill="#1b1416" stroke="#3d1b21"/>
  <text x="660" y="165" fill="#ef4151" font-family="'Anton', sans-serif" font-size="24">CASE 02: WINDOWS FILE SHARING</text>
  <text x="660" y="195" fill="#a09c9a" font-family="'Manrope', sans-serif" font-size="13">Symptom: Ping server 100% OK, but shared folder inaccessible.</text>

  <rect x="660" y="230" width="440" height="70" rx="4" fill="#251619" stroke="#332427"/>
  <text x="685" y="260" fill="#20bf6b" font-family="'Manrope', sans-serif" font-weight="700" font-size="13">ICMP Echo (Ping): SUCCESS (1ms, 0% loss)</text>
  <text x="685" y="285" fill="#a09c9a" font-family="'Manrope', sans-serif" font-size="11">Network L3 IP routing works properly.</text>

  <rect x="660" y="320" width="440" height="150" rx="4" fill="#251619" stroke="#ef4151"/>
  <text x="685" y="355" fill="#ef4151" font-family="'Manrope', sans-serif" font-weight="700" font-size="14">SMB Port 445 / NetBIOS Layer: FAILED</text>
  <text x="685" y="385" fill="#a09c9a" font-family="'Manrope', sans-serif" font-size="12">● Windows Defender Firewall blocking File & Printer Sharing</text>
  <text x="685" y="415" fill="#a09c9a" font-family="'Manrope', sans-serif" font-size="12">● Network Profile set to "Public" instead of "Private"</text>
  <text x="685" y="445" fill="#a09c9a" font-family="'Manrope', sans-serif" font-size="12">● SMB 1.0 disabled without proper LanmanWorkstation config</text>

  <rect x="660" y="520" width="440" height="65" rx="4" fill="#31151b"/>
  <text x="680" y="555" fill="#ff7584" font-family="'Manrope', sans-serif" font-weight="600" font-size="12">Lesson: ICMP ping only confirms IP connectivity, not service health.</text>
</svg>