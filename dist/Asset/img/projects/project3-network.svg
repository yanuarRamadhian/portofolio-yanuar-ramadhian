<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
    <rect width="960" height="600" fill="#0d0d0e"/>
    <rect x="20" y="20" width="920" height="560" rx="8" fill="#141416" stroke="#2a1f22"/>
    <!-- Top bar -->
    <rect x="20" y="20" width="920" height="50" rx="8" fill="#1b1718" stroke="#332427"/>
    <circle cx="50" cy="45" r="6" fill="#ef4151"/>
    <circle cx="70" cy="45" r="6" fill="#ffb830"/>
    <circle cx="90" cy="45" r="6" fill="#20bf6b"/>
    <text x="130" y="52" fill="#f2efeb" font-family="'Manrope', sans-serif" font-weight="700" font-size="14">MULTI-FLOOR OFFICE NETWORK ARCHITECTURE [MIKROTIK RB4011 / PCC / QOS]</text>
    <rect x="800" y="32" width="120" height="26" rx="4" fill="#ef4151" fill-opacity="0.2"/>
    <text x="815" y="49" fill="#ef4151" font-family="'Manrope', sans-serif" font-weight="800" font-size="10">WORK PROJECT</text>

    <!-- ISP boxes -->
    <rect x="60" y="100" width="180" height="70" rx="6" fill="#1b1718" stroke="#332427"/>
    <text x="80" y="130" fill="#ef4151" font-family="'Manrope', sans-serif" font-weight="700" font-size="13">ISP 1 (Fiber Optic)</text>
    <text x="80" y="152" fill="#a09c9a" font-family="'Manrope', sans-serif" font-size="11">Primary Gateway</text>

    <rect x="60" y="190" width="180" height="70" rx="6" fill="#1b1718" stroke="#332427"/>
    <text x="80" y="220" fill="#ef4151" font-family="'Manrope', sans-serif" font-weight="700" font-size="13">ISP 2 (Backup / High Bandwidth)</text>
    <text x="80" y="242" fill="#a09c9a" font-family="'Manrope', sans-serif" font-size="11">PCC Load Balanced</text>

    <!-- Router -->
    <rect x="320" y="130" width="280" height="110" rx="6" fill="#1b1718" stroke="#ef4151" stroke-width="2"/>
    <text x="340" y="165" fill="#f2efeb" font-family="'Manrope', sans-serif" font-weight="800" font-size="16">MikroTik RB4011iGS+</text>
    <text x="340" y="190" fill="#ef4151" font-family="'Manrope', sans-serif" font-weight="600" font-size="12">RouterOS v7.16.1</text>
    <text x="340" y="215" fill="#a09c9a" font-family="'Manrope', sans-serif" font-size="11">PCC, NAT, QoS, Netwatch Monitoring</text>

    <line x1="240" y1="135" x2="320" y2="160" stroke="#ef4151" stroke-width="2"/>
    <line x1="240" y1="225" x2="320" y2="200" stroke="#ef4151" stroke-width="2"/>

    <!-- Network targets -->
    <line x1="600" y1="185" x2="680" y2="120" stroke="#332427" stroke-width="2"/>
    <line x1="600" y1="185" x2="680" y2="200" stroke="#332427" stroke-width="2"/>
    <line x1="600" y1="185" x2="680" y2="280" stroke="#332427" stroke-width="2"/>
    <line x1="600" y1="185" x2="680" y2="360" stroke="#332427" stroke-width="2"/>

    <rect x="680" y="90" width="240" height="60" rx="4" fill="#1b1718" stroke="#332427"/>
    <text x="700" y="118" fill="#f2efeb" font-family="'Manrope', sans-serif" font-weight="700" font-size="12">VLAN 10: Office Clients</text>
    <text x="700" y="138" fill="#a09c9a" font-family="'Manrope', sans-serif" font-size="10">Bandwidth Managed (PCQ)</text>

    <rect x="680" y="170" width="240" height="60" rx="4" fill="#1b1718" stroke="#332427"/>
    <text x="700" y="198" fill="#f2efeb" font-family="'Manrope', sans-serif" font-weight="700" font-size="12">VLAN 20: NAS Shared Storage</text>
    <text x="700" y="218" fill="#20bf6b" font-family="'Manrope', sans-serif" font-size="10">Priority QoS & High Throughput</text>

    <rect x="680" y="250" width="240" height="60" rx="4" fill="#1b1718" stroke="#332427"/>
    <text x="700" y="278" fill="#f2efeb" font-family="'Manrope', sans-serif" font-weight="700" font-size="12">VLAN 30: CCTV NVR Stream</text>
    <text x="700" y="298" fill="#ef4151" font-family="'Manrope', sans-serif" font-size="10">Dedicated Bandwidth Policy</text>

    <rect x="680" y="330" width="240" height="60" rx="4" fill="#1b1718" stroke="#332427"/>
    <text x="700" y="358" fill="#f2efeb" font-family="'Manrope', sans-serif" font-weight="700" font-size="12">VLAN 40: Access Point Guest</text>
    <text x="700" y="378" fill="#a09c9a" font-family="'Manrope', sans-serif" font-size="10">Isolated Subnet & Rate-Limited</text>

    <!-- Monitoring Box -->
    <rect x="60" y="420" width="860" height="120" rx="6" fill="#1b1718" stroke="#332427"/>
    <text x="85" y="455" fill="#f2efeb" font-family="'Manrope', sans-serif" font-weight="700" font-size="13">Netwatch Failover & Automated Route Verification</text>
    <text x="85" y="485" fill="#20bf6b" font-family="'Manrope', sans-serif" font-size="12">● ISP 1 Gateway Ping: UP (12ms) | ● ISP 2 Gateway Ping: UP (14ms) | ● DNS 1.1.1.1: OK</text>
    <text x="85" y="515" fill="#a09c9a" font-family="'Manrope', sans-serif" font-size="11">Automated script switches default gateway if primary link packet loss exceeds threshold.</text>
  </svg>